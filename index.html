<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa de Apoyo de Beneficio Social | Registro Digital</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --secondary: #0d9488;
            --accent: #d97706;
            --bg-light: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .hero {
            text-align: center;
            padding: 3rem 1rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.25rem;
            color: var(--primary);
            margin-bottom: 0.75rem;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto 4rem;
            padding: 0 1rem;
        }

        .form-section {
            background: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 1.25rem;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 0.5rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 640px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .plans-grid {
                grid-template-columns: 1fr;
            }
        }

        .plan-card {
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background: #ffffff;
        }

        .plan-card:hover {
            border-color: var(--secondary);
        }

        .plan-card.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .plan-card input[type="radio"] {
            position: absolute;
            top: 1rem;
            right: 1rem;
            accent-color: var(--primary);
        }

        .plan-badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .plan-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .plan-features {
            list-style: none;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .plan-features li {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
        }

        .plan-features li::before {
            content: "✓";
            color: var(--secondary);
            font-weight: bold;
            margin-right: 0.5rem;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PABS Digital</div>
        <span style="font-size: 0.875rem; color: var(--text-muted);">Afiliación en línea</span>
    </header>

    <section class="hero">
        <h1>Programa de Apoyo de Beneficio Social</h1>
        <p>Regístrate en línea y asegura el respaldo integral que tú y tu familia necesitan.</p>
    </section>

    <main class="container">
        <form id="affiliationForm" onsubmit="handleSubmit(event)">
            
            <!-- Datos Personales -->
            <div class="form-section">
                <h2 class="section-title">1. Datos Personales del Titular</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="fullName">Nombre Completo *</label>
                        <input type="text" id="fullName" required placeholder="Ej. Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label for="phone">Teléfono de Contacto *</label>
                        <input type="tel" id="phone" required placeholder="(664) 000-0000">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="email">Correo Electrónico *</label>
                        <input type="email" id="email" required placeholder="correo@ejemplo.com">
                    </div>
                    <div class="form-group">
                        <label for="city">Ciudad *</label>
                        <select id="city" required>
                            <option value="">Selecciona tu ciudad</option>
                            <option value="Tijuana">Tijuana</option>
                            <option value="Tecate">Tecate</option>
                            <option value="Mexicali">Mexicali</option>
                            <option value="Ensenada">Ensenada</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Selección de Plan -->
            <div class="form-section">
                <h2 class="section-title">2. Selecciona tu Plan de Afiliación</h2>
                <div class="plans-grid">
                    
                    <label class="plan-card selected" id="card-basic" onclick="selectPlan('basic')">
                        <input type="radio" name="plan" id="plan-basic" value="Basico" checked>
                        <div class="plan-title">Plan Básico</div>
                        <p style="font-size: 0.875rem; color: var(--text-muted);">Protección esencial y cobertura inmediata para el titular.</p>
                        <ul class="plan-features">
                            <li>Coordinación de servicios de apoyo</li>
                            <li>Atención personalizada 24/7</li>
                            <li>Transferibilidad de beneficios</li>
                            <li>Descuentos en red de pactos sociales</li>
                        </ul>
                    </label>

                    <label class="plan-card" id="card-premium" onclick="selectPlan('premium')">
                        <span class="plan-badge">Recomendado</span>
                        <input type="radio" name="plan" id="plan-premium" value="Premium">
                        <div class="plan-title">Plan Premium</div>
                        <p style="font-size: 0.875rem; color: var(--text-muted);">Protección extendida con beneficios adicionales familiares.</p>
                        <ul class="plan-features">
                            <li>Todo lo incluido en el Plan Básico</li>
                            <li>Cobertura ampliada de titulares</li>
                            <li>Asistencia médica y tanatológica</li>
                            <li>Prioridad en atención y asignación</li>
                        </ul>
                    </label>

                </div>
            </div>

            <button type="submit" class="btn-submit">Completar Afiliación Digital</button>
        </form>
    </main>

    <script>
        function selectPlan(planType) {
            document.getElementById('card-basic').classList.remove('selected');
            document.getElementById('card-premium').classList.remove('selected');

            if (planType === 'basic') {
                document.getElementById('card-basic').classList.add('selected');
                document.getElementById('plan-basic').checked = true;
            } else {
                document.getElementById('card-premium').classList.add('selected');
                document.getElementById('plan-premium').checked = true;
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            
            const formData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                city: document.getElementById('city').value,
                plan: document.querySelector('input[name="plan"]:checked').value
            };

            alert(`¡Gracias por afiliarte, ${formData.fullName}!\n\nHas seleccionado el Plan ${formData.plan}.\nUn asesor se pondrá en contacto al teléfono ${formData.phone}.`);
        }
    </script>
</body>
</html>
